##############################################################################
# .github/workflows/terraform.yml
# Auth0 Online Banking IAM – Terraform CI/CD (GitHub Actions)
#
# Flow:  validate ─► dev ─► qa ─► staging ─► prod
#
# Each environment runs a Plan job followed by an approval-gated Apply job
# (see .github/workflows/terraform-env.yml). Approvals are configured on the
# GitHub *Environments* (dev / qa / staging / prod) under
#   Settings > Environments > <env> > Required reviewers.
#
# STATE: AWS S3, one bucket per environment account, per-env key. AWS access is
# obtained per-run via GitHub OIDC role assumption — no AWS keys in GitHub.
#
# CONFIGURATION NAMING (Settings > Secrets and variables > Actions — SUFFIX style):
#
#   Repository VARIABLES (non-sensitive):
#     AUTH0_DOMAIN_DEV | _QA | _STAGING | _PROD
#     AUTH0_CLIENT_ID_DEV | _QA | _STAGING | _PROD
#     AWS_ACCOUNT_ID_DEV | _QA | _STAGING | _PROD
#     AWS_REGION           (single, shared — defaults to us-east-1 if unset)
#     AWS_OIDC_ROLE_NAME   (single, shared — defaults to github-actions-terraform)
#
#   Repository SECRETS (sensitive):
#     AUTH0_CLIENT_SECRET_DEV | _QA | _STAGING | _PROD        (exists)
#     SENDGRID_API_KEY_DEV | _QA | _STAGING | _PROD           (CREATE THESE)
#     CIF_VALIDATION_API_SECRET_DEV | _QA | _STAGING | _PROD  (CREATE THESE)
#
# NOTE: A SANDBOX environment exists in the repo's variables/secrets but is not
# part of this promotion chain. To add it, copy the dev job, point it at the
# *_SANDBOX names, and create backend/sandbox.hcl + terraform.sandbox.tfvars.
#
# Pull requests run validate + plan only; apply never runs off `main`.
##############################################################################

name: Auth0 OLB IAM – Terraform

on:
  push:
    branches: [ main ]
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'backend/**'
      - '.github/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'backend/**'
      - '.github/**'

# Least-privilege defaults; id-token is needed for AWS OIDC (state backend).
permissions:
  contents: read
  id-token: write

# Serialize runs on the same ref so two pipelines never fight over state.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.8'

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # VALIDATE – fast, credential-free checks. Runs on every PR and push.
  # ══════════════════════════════════════════════════════════════════════════
  validate:
    name: Validate (fmt / init / validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      # -backend=false: syntax/schema validation needs no AWS credentials and
      # no remote state access.
      - name: terraform validate
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate -no-color

  # ══════════════════════════════════════════════════════════════════════════
  # DEV
  # ══════════════════════════════════════════════════════════════════════════
  dev:
    name: DEV
    needs: validate
    uses: ./.github/workflows/terraform-env.yml
    with:
      environment: dev
      terraform-version: '1.9.8'
      auth0-domain: ${{ vars.AUTH0_DOMAIN_DEV }}
      auth0-client-id: ${{ vars.AUTH0_CLIENT_ID_DEV }}
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID_DEV }}
      aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      aws-oidc-role-name: ${{ vars.AWS_OIDC_ROLE_NAME || 'github-actions-terraform' }}
    secrets:
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET_DEV }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY_DEV }}
      CIF_VALIDATION_API_SECRET: ${{ secrets.CIF_VALIDATION_API_SECRET_DEV }}

  # ══════════════════════════════════════════════════════════════════════════
  # QA
  # ══════════════════════════════════════════════════════════════════════════
  qa:
    name: QA
    needs: dev
    uses: ./.github/workflows/terraform-env.yml
    with:
      environment: qa
      terraform-version: '1.9.8'
      auth0-domain: ${{ vars.AUTH0_DOMAIN_QA }}
      auth0-client-id: ${{ vars.AUTH0_CLIENT_ID_QA }}
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID_QA }}
      aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      aws-oidc-role-name: ${{ vars.AWS_OIDC_ROLE_NAME || 'github-actions-terraform' }}
    secrets:
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET_QA }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY_QA }}
      CIF_VALIDATION_API_SECRET: ${{ secrets.CIF_VALIDATION_API_SECRET_QA }}

  # ══════════════════════════════════════════════════════════════════════════
  # STAGING
  # ══════════════════════════════════════════════════════════════════════════
  staging:
    name: STAGING
    needs: qa
    uses: ./.github/workflows/terraform-env.yml
    with:
      environment: staging
      terraform-version: '1.9.8'
      auth0-domain: ${{ vars.AUTH0_DOMAIN_STAGING }}
      auth0-client-id: ${{ vars.AUTH0_CLIENT_ID_STAGING }}
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID_STAGING }}
      aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      aws-oidc-role-name: ${{ vars.AWS_OIDC_ROLE_NAME || 'github-actions-terraform' }}
    secrets:
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET_STAGING }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY_STAGING }}
      CIF_VALIDATION_API_SECRET: ${{ secrets.CIF_VALIDATION_API_SECRET_STAGING }}

  # ══════════════════════════════════════════════════════════════════════════
  # PROD
  # ══════════════════════════════════════════════════════════════════════════
  prod:
    name: PROD
    needs: staging
    uses: ./.github/workflows/terraform-env.yml
    with:
      environment: prod
      terraform-version: '1.9.8'
      auth0-domain: ${{ vars.AUTH0_DOMAIN_PROD }}
      auth0-client-id: ${{ vars.AUTH0_CLIENT_ID_PROD }}
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID_PROD }}
      aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      aws-oidc-role-name: ${{ vars.AWS_OIDC_ROLE_NAME || 'github-actions-terraform' }}
    secrets:
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET_PROD }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY_PROD }}
      CIF_VALIDATION_API_SECRET: ${{ secrets.CIF_VALIDATION_API_SECRET_PROD }}
